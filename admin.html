<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Besarti · Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--c2:#efe9db;--tx:#18181b;--mu:#6d6a62;--gold:#a97c1f;--gd:linear-gradient(135deg,#d9b25c,#a97c1f);--ok:#1f9d63;--bad:#d6404a;--bd:#e0d9c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0f;--card:#17171b;--c2:#202027;--tx:#f4f1ea;--mu:#9a968c;--gold:#d4a84b;--gd:linear-gradient(135deg,#f0cf86,#d4a84b);--ok:#4cc38a;--bad:#e5565b;--bd:#2b2b33}}
:root[data-theme="dark"]{--bg:#0d0d0f;--card:#17171b;--c2:#202027;--tx:#f4f1ea;--mu:#9a968c;--gold:#d4a84b;--gd:linear-gradient(135deg,#f0cf86,#d4a84b);--ok:#4cc38a;--bad:#e5565b;--bd:#2b2b33}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--bg);border-bottom:1px solid var(--bd)}
.logo{font:800 18px 'Playfair Display',serif}.logo b{color:var(--gold)}
.gear{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px}
.bdg{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;margin-left:5px}.bdg:empty{display:none}
.wrap{max-width:520px;margin:auto;padding:28px 18px 50px}
.wrap h1{font-size:32px;line-height:1.1}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.btn{background:var(--gd);color:#1a1405;border:0;padding:12px 20px;border-radius:999px;font:600 14px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--bad);color:#fff}.btn.g{background:var(--ok);color:#fff}
.btn.sm{padding:7px 12px;font-size:12px}.btn.wide{width:100%;margin-top:20px}
label{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px}
input,select{width:100%;padding:12px 13px;background:var(--c2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;font:15px Inter,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.slot{padding:10px 0;text-align:center;background:var(--c2);border:1px solid var(--bd);border-radius:10px;cursor:pointer}
.slot.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}.slot.x{opacity:.3;pointer-events:none;text-decoration:line-through}
.msg{grid-column:1/-1;color:var(--mu);padding:6px 0}
.okbox{display:none;margin-top:14px;padding:14px;border-radius:12px;background:rgba(31,157,99,.14);color:var(--ok);text-align:center;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:var(--ok);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;transition:.35s;z-index:99;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}.toast.err{background:var(--bad)}
#panel{position:fixed;top:0;bottom:0;left:0;right:0;background:var(--bg);z-index:30;overflow-y:auto;display:none}
#panel.open{display:block}
.ph{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
.pb{max-width:760px;margin:auto;padding:16px 16px 60px}
#login,#deny{max-width:320px;margin:80px auto;text-align:center;padding:0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{text-align:center;padding:12px 4px}.stat b{display:block;font:800 24px 'Playfair Display',serif;color:var(--gold)}.stat span{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 15px;border-radius:999px;border:1px solid var(--bd);background:none;color:var(--mu);cursor:pointer;font:500 13px Inter,sans-serif;white-space:nowrap}.tab.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.nav{display:flex;gap:6px;margin-bottom:10px;align-items:center}.nav input{flex:1}
.dh{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;gap:8px;flex-wrap:wrap}
.bk{display:flex;gap:12px;align-items:center;margin-bottom:8px;padding:12px}
.bk.pending{border-left:4px solid var(--gold)}.bk.confirmed{border-left:4px solid var(--ok)}.bk.cancelled{opacity:.55;border-left:4px solid var(--bad)}.bk.done{border-left:4px solid var(--mu)}
.tm{text-align:center;min-width:52px;font-size:12px;color:var(--mu)}.tm b{font-size:17px;color:var(--tx)}
.in{flex:1;min-width:0}.in h4{font-size:15px}.in small{display:block;color:var(--mu)}.in a{color:var(--gold);text-decoration:none;margin-right:10px}
.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--c2);color:var(--gold);vertical-align:middle}.tag.confirmed{color:var(--ok)}.tag.cancelled{color:var(--bad)}.tag.done{color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:34px 0}
.edit{display:flex;gap:8px;margin-bottom:8px;align-items:center}.edit input{flex:1;min-width:0}.edit input.n{flex:0 0 74px}
.days{display:flex;gap:6px;flex-wrap:wrap}.days .btn{min-width:52px;text-align:center}
.card+.card{margin-top:12px}.note{font-size:12px;color:var(--mu);margin-top:8px}
#modal{position:fixed;top:0;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:10px;margin-top:20px}.row .btn{flex:1}

.am #cv{display:none}
#cv{min-height:100vh}
.hero{position:relative;overflow:hidden;padding:calc(34px + env(safe-area-inset-top,0px)) 24px 84px;color:#f4f1ea;background:radial-gradient(110% 80% at 90% 0%,rgba(217,178,92,.38),transparent 55%),radial-gradient(70% 60% at 0% 100%,rgba(214,64,74,.14),transparent 60%),linear-gradient(160deg,#1c160a,#0d0d0f 72%)}
.hero small{letter-spacing:5px;font-size:11px;color:#e3c070;text-transform:uppercase}
.hero h1{font-size:clamp(44px,13vw,64px);line-height:.98;margin:14px 0 14px;font-weight:800}
.hero h1 span{background:linear-gradient(135deg,#f6dc98,#c9972f);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#b9b4a6;max-width:270px;font-size:15px}
.pole{position:absolute;right:26px;top:calc(30px + env(safe-area-inset-top,0px));width:28px;height:124px;border-radius:15px;border:2px solid rgba(255,255,255,.2);background:repeating-linear-gradient(135deg,#d6404a 0 10px,#f4f1ea 10px 20px,#2c5fb8 20px 30px);background-size:42px 42px;box-shadow:0 0 40px rgba(217,178,92,.3);animation:pole 1.2s linear infinite}
@keyframes pole{to{background-position:0 42px}}
.sheetc{position:relative;max-width:560px;margin:-48px auto 0;padding:0 16px 130px}
.step{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px 18px;margin-bottom:14px;box-shadow:0 14px 36px rgba(0,0,0,.09);animation:up .5s both}
.step:nth-child(2){animation-delay:.06s}.step:nth-child(3){animation-delay:.12s}.step:nth-child(4){animation-delay:.18s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.step h3{font:700 19px 'Playfair Display',serif;display:flex;align-items:center;gap:11px;margin-bottom:16px}
.step h3 i{font:700 13px Inter,sans-serif;width:27px;height:27px;border-radius:50%;background:var(--gd);color:#1a1405;display:grid;place-items:center}
.svcs{display:grid;gap:10px}
.sv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 16px;border:1.5px solid var(--bd);border-radius:18px;cursor:pointer;background:var(--c2);transition:.2s}
.sv b{display:block;font-weight:600}.sv small{color:var(--mu)}.sv .pr{font:700 20px 'Playfair Display',serif;color:var(--gold)}
.sv.on{border-color:var(--gold);background:var(--card);box-shadow:0 0 0 4px rgba(212,168,75,.2)}
.dates{display:flex;gap:9px;overflow-x:auto;padding:3px 3px 10px;margin:0 -3px;scroll-snap-type:x proximity;scrollbar-width:none}.dates::-webkit-scrollbar{display:none}
.dt{flex:0 0 64px;scroll-snap-align:start;text-align:center;padding:11px 0;border-radius:18px;border:1.5px solid var(--bd);background:var(--c2);cursor:pointer;transition:.2s}
.dt span,.dt em{display:block;font-size:11px;color:var(--mu);text-transform:uppercase;font-style:normal;letter-spacing:.5px}.dt b{display:block;font:700 24px 'Playfair Display',serif;line-height:1.25}
.dt.on{background:var(--gd);border-color:transparent;color:#1a1405;transform:translateY(-3px);box-shadow:0 8px 20px rgba(212,168,75,.4)}.dt.on span,.dt.on em{color:#4a3a10}
.dt.x{opacity:.3;pointer-events:none}
.grp{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--mu);margin:16px 0 9px}.grp:first-child{margin-top:0}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:11px 0;border-radius:14px;font-weight:500;transition:.15s}.slot.on{background:var(--gd);border-color:transparent;color:#1a1405;font-weight:700;transform:scale(1.06);box-shadow:0 6px 16px rgba(212,168,75,.4)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--bd);display:flex;gap:14px;align-items:center;justify-content:center}
.sum{flex:1;min-width:0;font-size:13px;line-height:1.35;color:var(--mu);max-width:340px}.sum b{display:block;color:var(--tx);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .btn{padding:15px 28px;font-size:15px;opacity:.45;transition:.2s}.bar .btn.rdy{opacity:1;box-shadow:0 10px 26px rgba(212,168,75,.45)}
.thanks{display:none;text-align:center;padding:36px 20px}.thanks h2{font-size:26px;margin-bottom:6px}.thanks .ck{width:76px;height:76px;border-radius:50%;background:var(--gd);color:#1a1405;font-size:38px;display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s}
@keyframes pop{from{transform:scale(0)}}
.foot{text-align:center;padding:8px 0 18px;font-size:12px;color:var(--mu)}.foot a{color:var(--mu);text-decoration:underline;cursor:pointer}
.msg{color:var(--mu);padding:4px 0}
:root{padding-top:0}.ph{display:flex}</style>
</head>
<body>
<div class="ph" id="hd" style="display:none"><div class="logo">PANELI <b>BESARTI</b></div><button class="btn o sm" onclick="logout()">Dil</button></div>
<div id="login" style="display:none"><h2 style="margin-bottom:14px">Hyrje berberi</h2><input id="em" type="email" placeholder="Email" autocomplete="username" style="margin-bottom:10px"><input id="pw" type="password" placeholder="Fjalëkalimi" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn wide" onclick="doLogin()">Hyr</button></div>
<div class="pb" id="pbody" style="display:none">
  <div class="stats"><div class="card stat"><b id="sT">0</b><span>Sot</span></div><div class="card stat"><b id="sP">0</b><span>Në pritje</span></div><div class="card stat"><b id="sR">0€</b><span>Të ardhura muaji</span></div></div>
  <div class="tabs"><button class="tab on" data-t="day">Agjenda</button><button class="tab" data-t="pend">Në pritje</button><button class="tab" data-t="all">Të gjitha</button><button class="tab" data-t="set">Cilësimet</button></div>
  <div id="tabBody"></div>
</div>
<div id="modal" onclick="if(event.target===this)closeForm()"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>

const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DN=['E diel','E hënë','E martë','E mërkurë','E enjte','E premte','E shtunë'],DS=['Die','Hën','Mar','Mër','Enj','Pre','Sht'],ORD=[1,2,3,4,5,6,0];
const pad=n=>String(n).padStart(2,'0'),ymd=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()),today=()=>ymd(new Date());
const mins=t=>{const[h,m]=t.split(':');return +h*60+ +m},hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return ymd(x)};
const newId=()=>'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const DEF={services:[{n:'Prerje flokësh',p:8,d:30},{n:'Rruajtje e mjekrës',p:5,d:30},{n:'Prerje + Mjekër',p:12,d:60},{n:'Prerje për fëmijë',p:6,d:30}],open:'09:00',close:'20:00',days:[1,2,3,4,5,6],off:[],brk:null};
let S=JSON.parse(JSON.stringify(DEF)),B=[],tab='day',day=today(),pick=null,q='',lastP=-1;
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',2800)}
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function norm(){S.off=S.off||[];S.days=S.days||[1,2,3,4,5,6]}
/* ---------- availability ---------- */
function closed(d){const wd=new Date(d+'T12:00').getDay();if(!S.days.includes(wd))return 'Besarti nuk punon: '+DN[wd].toLowerCase()+'.';const o=S.off.find(o=>d>=o.from&&d<=o.to);return o?'Besarti është në pushim'+(o.note?' ('+o.note+')':'')+' në këtë datë.':''}
function conflict(L,d,t,dur,ignore){const k=S.brk;if(k&&k.from&&k.to&&mins(t)<mins(k.to)&&mins(k.from)<mins(t)+dur)return true;
  return L.some(b=>b.id!==ignore&&b.date===d&&b.status!=='cancelled'&&mins(t)<mins(b.time)+(b.d||30)&&mins(b.time)<mins(t)+dur)}

/* ---------- panel ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){tab=t.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));renderPanel()}});

function card(b,sd){
  const st={pending:'Në pritje',confirmed:'Konfirmuar',done:'U krye',cancelled:'Anuluar'}[b.status],ph=esc(b.phone||''),wa=String(b.phone||'').replace(/\D/g,'');let a='';
  if(b.status==='pending')a+=`<button class="btn g sm" onclick="setSt('${b.id}','confirmed')">✓ Konfirmo</button>`;
  if(b.status==='confirmed')a+=`<button class="btn g sm" onclick="setSt('${b.id}','done')">✔ U krye</button>`;
  if(b.status==='pending'||b.status==='confirmed')a+=`<button class="btn o sm" onclick="showForm('${b.id}')">✎</button><button class="btn r sm" onclick="setSt('${b.id}','cancelled')">✕</button>`;
  if(b.status==='cancelled')a+=`<button class="btn o sm" onclick="delBk('${b.id}')">🗑 Fshi</button>`;
  return `<div class="card bk ${b.status}"><div class="tm">${sd?esc(b.date.slice(5))+'<br>':''}<b>${esc(b.time)}</b></div><div class="in"><h4>${esc(b.name)} <span class="tag ${b.status}">${st}</span></h4><small>${esc(b.svc)} · ${b.price}€ · ${b.d||30} min${b.src==='manual'?' · manual':''}</small><small>${ph?`<a href="tel:${ph}">📞 ${ph}</a>`:''}${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}</small></div><div class="acts">${a}</div></div>`}
const byTime=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);

function renderPanel(){
  const td=today(),mo=td.slice(0,7);
  $('#sT').textContent=B.filter(b=>b.date===td&&b.status!=='cancelled').length;
  $('#sP').textContent=B.filter(b=>b.status==='pending').length;
  $('.tab[data-t=pend]').textContent='Në pritje'+(B.filter(b=>b.status==='pending').length?' ('+B.filter(b=>b.status==='pending').length+')':'');
  $('#sR').textContent=B.filter(b=>b.status==='done'&&b.date.slice(0,7)===mo).reduce((a,b)=>a+(+b.price||0),0)+'€';
  const box=$('#tabBody');
  if(tab==='day'){
    const L=B.filter(b=>b.date===day&&b.status!=='cancelled').sort(byTime),c=closed(day),single=S.off.some(o=>o.from===day&&o.to===day);
    box.innerHTML=`<div class="nav"><button class="btn o sm" onclick="goDay(-1)">‹</button><input type="date" value="${day}" onchange="day=this.value||day;renderPanel()"><button class="btn o sm" onclick="goDay(1)">›</button><button class="btn o sm" onclick="day=today();renderPanel()">Sot</button></div>
    <div class="dh"><h3>${DN[new Date(day+'T12:00').getDay()]}, ${day.split('-').reverse().join('.')}</h3><button class="btn sm" onclick="showForm()">+ Termin</button></div>
    ${c?`<div class="card" style="margin-bottom:10px;color:var(--bad)">${esc(c)}</div>`:''}
    ${L.length?L.map(b=>card(b)).join(''):'<div class="empty">Asnjë termin këtë ditë.</div>'}
    ${(!c||single)?`<div style="margin-top:14px"><button class="btn o sm" onclick="toggleDayOff()">${single?'Hap këtë ditë':'Mbyll këtë ditë (pushim)'}</button></div>`:''}`;
  }else if(tab==='pend'){
    const L=B.filter(b=>b.status==='pending').sort(byTime);
    box.innerHTML=L.length?L.map(b=>card(b,1)).join(''):'<div class="empty">Asnjë kërkesë në pritje.</div>';
  }else if(tab==='all'){
    box.innerHTML=`<input id="qs" placeholder="Kërko emër, telefon ose shërbim" value="${esc(q)}" oninput="q=this.value;allList()" style="margin-bottom:12px"><div id="lst"></div>`;allList();
  }else renderSet(box);
}
function goDay(n){day=addD(day,n);renderPanel()}
function allList(){const k=q.trim().toLowerCase(),L=B.filter(b=>!k||(b.name+' '+b.phone+' '+b.svc).toLowerCase().includes(k)).sort((a,b)=>byTime(b,a));
  $('#lst').innerHTML=L.length?L.map(b=>card(b,1)).join(''):'<div class="empty">Nuk u gjet asgjë.</div>'}
function toggleDayOff(){const i=S.off.findIndex(o=>o.from===day&&o.to===day);i>=0?S.off.splice(i,1):S.off.push({from:day,to:day,note:''});saveSet()}

/* manual / edit booking */
function showForm(id){const b=id?B.find(x=>x.id===id):null;
  $('#modal').innerHTML=`<div class="sheet card"><h3>${b?'Ndrysho terminin':'Termin i ri'}</h3>
  <label>Shërbimi</label><select id="mS">${S.services.map((s,i)=>`<option value="${i}"${b&&b.svc===s.n?' selected':''}>${esc(s.n)} — ${s.p}€</option>`).join('')}</select>
  <div class="two"><div><label>Data</label><input type="date" id="mD" value="${b?b.date:day}"></div><div><label>Ora</label><input type="time" id="mT" step="900" value="${b?b.time:''}"></div></div>
  <label>Emri</label><input id="mN" value="${b?esc(b.name):''}"><label>Telefoni</label><input id="mP" type="tel" value="${b?esc(b.phone):''}">
  <div class="row"><button class="btn o" onclick="closeForm()">Mbyll</button><button class="btn" onclick="saveForm('${id||''}')">Ruaj</button></div></div>`;$('#modal').style.display='flex'}
function closeForm(){$('#modal').style.display='none'}
async function saveForm(id){
  const s=S.services[+$('#mS').value],d=$('#mD').value,t=$('#mT').value,n=$('#mN').value.trim(),p=$('#mP').value.trim();
  if(!s||!d||!t||!n)return toast('Plotëso emrin, datën dhe orën',1);
  const c=closed(d);if(c)return toast(c,1);
  if(mins(t)<mins(S.open)||mins(t)+s.d>mins(S.close))return toast('Jashtë orarit të punës',1);
  if(conflict(B,d,t,s.d,id))return toast('Ky orar është i zënë',1);
  const o=id?B.find(x=>x.id===id):null;
  await saveBk({...(o||{id:newId(),status:'confirmed',src:'manual'}),svc:s.n,price:s.p,d:s.d,date:d,time:t,name:n,phone:p});
  closeForm();day=d;if(tab!=='day'&&!o){tab='day';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t==='day'))}renderPanel();toast('✓ U ruajt')}

/* settings */
function renderSet(box){const k=S.brk||{};
  box.innerHTML=`<div class="card"><h3 style="margin-bottom:6px">Ditët e punës</h3><div class="days">${ORD.map(i=>`<button class="btn sm ${S.days.includes(i)?'':'o'}" onclick="toggleDay(${i})">${DS[i]}</button>`).join('')}</div><p class="note">Ditët e theksuara janë ditë pune. Klientët nuk rezervojnë në ditët e tjera.</p>
  <label>Ora e hapjes / mbylljes</label><div class="edit"><input type="time" value="${S.open}" onchange="setHrs('open',this.value)"><input type="time" value="${S.close}" onchange="setHrs('close',this.value)"></div>
  <label>Pauzë ditore (p.sh. drekë)</label><div class="edit"><input type="time" value="${k.from||''}" onchange="setBrk('from',this.value)"><input type="time" value="${k.to||''}" onchange="setBrk('to',this.value)"><button class="btn r sm" onclick="setBrk('x')">✕</button></div></div>
  <div class="card"><h3 style="margin-bottom:6px">Ditë pushimi</h3>${S.off.length?S.off.map((o,i)=>`<div class="edit"><span style="flex:1;font-size:14px">${esc(o.from)}${o.from!==o.to?' → '+esc(o.to):''}${o.note?' · '+esc(o.note):''}</span><button class="btn r sm" onclick="delOff(${i})">✕</button></div>`).join(''):'<p class="note" style="margin:0 0 8px">Asnjë ditë pushimi.</p>'}
  <div class="edit"><input type="date" id="oF"><input type="date" id="oT"></div><div class="edit"><input id="oN" placeholder="Arsyeja (opsionale)"><button class="btn sm" onclick="addOff()">+ Shto</button></div><p class="note">Për një ditë të vetme lëre datën e dytë bosh.</p></div>
  <div class="card"><h3 style="margin-bottom:6px">Shërbimet</h3>${S.services.map((s,i)=>`<div class="edit"><input value="${esc(s.n)}" onchange="setSvc(${i},'n',this.value)"><input class="n" type="number" min="0" value="${s.p}" onchange="setSvc(${i},'p',this.value)"><input class="n" type="number" min="5" step="5" value="${s.d}" onchange="setSvc(${i},'d',this.value)"><button class="btn r sm" onclick="delSvc(${i})">✕</button></div>`).join('')}<p class="note" style="margin:0 0 10px">Emri · çmimi (€) · minuta</p><button class="btn o sm" onclick="addSvc()">+ Shto shërbim</button></div>
  <div class="card"><h3 style="margin-bottom:6px">Fjalëkalimi</h3><div class="edit"><input id="np" type="password" placeholder="Fjalëkalim i ri (min. 8 karaktere)"><button class="btn sm" onclick="setPass()">Ruaj</button></div></div>`}
function toggleDay(i){const w=S.days;w.includes(i)?w.splice(w.indexOf(i),1):w.push(i);saveSet()}
function setHrs(k,v){if(!v)return;if(mins(k==='open'?v:S.open)>=mins(k==='close'?v:S.close)){toast('Ora e hapjes duhet të jetë para mbylljes',1);return renderPanel()}S[k]=v;saveSet()}
function setBrk(k,v){if(k==='x')S.brk=null;else{S.brk=S.brk||{from:'',to:''};S.brk[k]=v}saveSet()}
function addOff(){const f=$('#oF').value,t=$('#oT').value||f;if(!f||t<f)return toast('Zgjidh datat saktë',1);S.off.push({from:f,to:t,note:$('#oN').value.trim()});S.off.sort((a,b)=>a.from.localeCompare(b.from));saveSet();toast('✓ Pushimi u shtua')}
function delOff(i){S.off.splice(i,1);saveSet()}
function setSvc(i,k,v){S.services[i][k]=k==='n'?(v.trim()||'Shërbim'):Math.max(k==='d'?5:0,+v||0);saveSet(false)}
function addSvc(){S.services.push({n:'Shërbim i ri',p:10,d:30});saveSet()}
function delSvc(i){if(S.services.length<2)return toast('Duhet të mbetet një shërbim',1);S.services.splice(i,1);saveSet()}
async function setPass(){const v=$('#np').value;if(v.length<8)return toast('Të paktën 8 karaktere',1);const r=await sb.auth.updateUser({password:v});r.error?toast('Nuk u ndryshua',1):(($('#np').value=''),toast('✓ Fjalëkalimi u ndryshua'))}


/* ---------- supabase ---------- */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),db=true;
const toB=r=>({id:r.id,svc:r.service,price:+r.price,d:r.duration,date:r.date,time:hm(r.start_min),name:r.name,phone:r.phone||'',status:r.status,src:r.source});
const toR=b=>({id:b.id,service:b.svc,price:b.price,duration:b.d||30,date:b.date,start_min:mins(b.time),name:b.name,phone:b.phone||'',status:b.status,source:b.src||'manual'});
async function load(first){
  const a=await sb.from('settings').select('data').eq('id',1).maybeSingle();if(a.data){S=Object.assign(S,a.data.data);norm()}
  const c=await sb.from('bookings').select('*').order('date').limit(3000);if(c.error)return toast('Gabim në lidhje',1);
  B=c.data.map(toB);const n=B.filter(b=>b.status==='pending').length;if(!first&&n>lastP)toast('🔔 Rezervim i ri!');lastP=n;renderPanel();
}
function saveSet(r=true){sb.from('settings').upsert({id:1,data:S}).then(x=>x.error&&toast('Nuk u ruajt',1));if(r)renderPanel()}
async function saveBk(b){const i=B.findIndex(x=>x.id===b.id);i<0?B.push(b):B[i]=b;renderPanel();const x=await sb.from('bookings').upsert(toR(b));if(x.error)toast('Nuk u ruajt',1)}
async function delBk(id){B=B.filter(x=>x.id!==id);renderPanel();await sb.from('bookings').delete().eq('id',id)}
function setSt(id,st){const b=B.find(x=>x.id===id);if(b)saveBk({...b,status:st})}
async function boot(){const r=await sb.auth.getSession();r.data.session?enter():$('#login').style.display='block'}
async function doLogin(){const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});r.error?toast('Email ose fjalëkalim i gabuar',1):enter()}
async function enter(){$('#login').style.display='none';$('#pbody').style.display='block';$('#hd').style.display='flex';await load(true);
  sb.channel('bk').on('postgres_changes',{event:'*',schema:'public',table:'bookings'},()=>load()).subscribe();setInterval(load,30000)}
async function logout(){await sb.auth.signOut();location.reload()}
boot();

</script>
</body>
</html>
